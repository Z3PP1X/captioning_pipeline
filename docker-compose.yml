# ==============================================================================
# Krea 2 LoRA Dataset Curation & Captioning Studio — docker-compose.yml
# Optimized for Windows 11 + WSL2 Bind Mounts & Linux Native Volume Performance
# ==============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: krea2-captioning-backend:latest
    container_name: krea2-captioning-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - PIPELINE_APPDATA_DIR=/var/lib/captioning_pipeline
      - PIPELINE_INPUT_DIR=/data/input
      - PIPELINE_EXPORT_DIR=/data/exports
      - PRIMARY_MODEL=${PRIMARY_MODEL:-google/gemini-2.5-pro}
      - FALLBACK_MODEL_1=${FALLBACK_MODEL_1:-qwen/qwen-2.5-vl-72b-instruct}
      - FALLBACK_MODEL_2=${FALLBACK_MODEL_2:-meta-llama/llama-3.2-90b-vision-instruct}
    volumes:
      # 1. WSL2 Host Media Bind-Mounts (Sequential Read/Write Only)
      # Maps HOST_MEDIA_ROOT (e.g., /mnt/c/Users/.../lora_raw_data or /home/user/data)
      - "${HOST_MEDIA_ROOT:-./data/input}:/data/input:ro"
      - "${HOST_EXPORT_ROOT:-${HOST_MEDIA_ROOT:-./data}/exports}:/data/exports:rw"

      # 2. Named Docker Volume on Native Linux ext4 Filesystem (CRITICAL for WSL2!)
      # Stores SQLite WAL database (state.db), 384px WebP thumbnails, extracted temporary
      # video frames, and RAG TF-IDF/SVD indices to bypass the Windows /mnt/c 9P bottleneck.
      - pipeline_appdata:/var/lib/captioning_pipeline

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: krea2-captioning-frontend:latest
    container_name: krea2-captioning-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-4200}:80"

volumes:
  pipeline_appdata:
    driver: local
