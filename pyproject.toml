[project]
name = "captioning-pipeline"
version = "0.1.0"
description = "Video frame extraction, quality control, curation and dataset export pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
    "av>=13.0",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pillow>=10.4",
    "onnxruntime>=1.19",
    "tokenizers>=0.20",
    "huggingface_hub>=0.25",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
