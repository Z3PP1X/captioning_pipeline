[project]
name = "captioning-pipeline"
version = "0.1.0"
description = "Video frame extraction, quality control, curation and dataset export pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
    "av>=13.0",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pillow>=10.4",
    "onnxruntime>=1.19",
    "tokenizers>=0.20",
    "huggingface_hub>=0.25",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "big-o>=0.11.0",
    "complexipy>=8.2.0",
    "mypy>=2.4.0",
    "pytest>=8.0",
    "pytest-benchmark>=5.3.0",
    "pytest-memray>=1.11.0",
    "radon>=6.0.1",
    "ruff>=0.17.2",
    "scipy>=1.18.1",
    "xenon>=0.9.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "benchmark: mark test as a benchmark",
    "limit_memory: mark test with a memory allocation ceiling",
    "complexity: algorithmic complexity verification",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "scripts", "tests"]
extend-exclude = [
    ".venv",
    "node_modules",
    "src/web",
    "dist",
]

[tool.ruff.lint]
select = [
    "C90",     # mccabe: cyclomatic complexity
    "PERF",    # perflint: performance anti-patterns
    "PLR",     # pylint-refactor: complexity, branches, args, nesting
    "NPY",     # NumPy-specific rules
    "ASYNC",   # flake8-async: blocking calls in async def
    "B",       # flake8-bugbear
    "E",       # pycodestyle errors
    "F",       # pyflakes
    "I",       # isort
    "SIM",     # flake8-simplify
    "UP",      # pyupgrade
]
ignore = [
    "PLR2004", # Magic value comparison
    "E501",    # Line too long (handled by formatter / readability)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 12
max-statements = 50

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913", "PLR0915", "PLR0912", "C901", "ASYNC", "PERF"]
"scripts/**" = ["PLR0913", "PLR0915", "PLR0912", "C901"]

[tool.complexipy]
max_complexity = 15
max_complexity_allowed = 15

[tool.xenon]
max_absolute = "B"
max_modules = "A"
max_average = "A"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["numpy.typing.mypy_plugin"]
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = [
    "^node_modules",
    "^dist",
    "^\\.venv",
    "^src/web",
]
